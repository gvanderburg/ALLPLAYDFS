openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dfs
    description: Daily fantasy sports dashboard
paths:
  /feedback:
    get:
      operationId: listFeedbackTickets
      tags: [feedback]
      summary: Signed-in users see their tickets; owners may review all tickets
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, all], default: mine }
        - in: query
          name: before
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private ticket page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackTicketPage" }
        "401": { description: Sign-in required }
        "403": { description: Owner access required for all tickets }
    post:
      operationId: createFeedbackTicket
      tags: [feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackTicketInput" }
      responses:
        "201":
          description: Saved ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackTicket" }
        "400": { description: Invalid feedback }
        "401": { description: Sign-in required }
        "429": { description: At most five submissions per hour }
  /feedback/{ticketId}:
    patch:
      operationId: updateFeedbackTicket
      tags: [feedback]
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackTicketUpdate" }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackTicket" }
        "400": { description: Invalid status or response }
        "401": { description: Sign-in required }
        "403": { description: Owner access required }
        "404": { description: Ticket not found }
  /takes:
    get:
      operationId: listGameTakes
      tags: [takes]
      summary: List members-only game takes; unpaid accounts receive no items
      responses:
        "200":
          description: Verified access and content
          content:
            application/json:
              schema:
                type: object
                required: [hasAccess, isOwner, items]
                properties:
                  hasAccess: { type: boolean }
                  isOwner: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GameTake" }
    post:
      operationId: createGameTake
      tags: [takes]
      summary: Owner publishes a completed, verified upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishTakeInput"
      responses:
        "201":
          description: Published take
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameTake" }
        "403": { description: Owner access required }
        "400": { description: Invalid metadata or incomplete upload }
  /takes/uploads:
    post:
      operationId: requestTakeUpload
      tags: [takes]
      summary: Owner requests a private direct-upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeUploadInput"
      responses:
        "200":
          description: Private upload ticket; PUT file bytes directly to uploadUrl before publishing
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, uploadUrl]
                properties:
                  uploadId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
        "403": { description: Owner access required }
        "400": { description: Invalid file or size }
  /takes/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateGameTake
      tags: [takes]
      summary: Owner edits title, description, sport and game
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameTakeInput" }
      responses:
        "200":
          description: Updated take
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameTake" }
        "403": { description: Owner access required }
        "404": { description: Take not found }
    delete:
      operationId: deleteGameTake
      tags: [takes]
      summary: Owner removes a take and its protected file
      responses:
        "204": { description: Removed }
        "403": { description: Owner access required }
        "404": { description: Take not found }
  /takes/{id}/file:
    get:
      operationId: getGameTakeFile
      tags: [takes]
      summary: Stream document or video after current membership verification; supports byte ranges
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Protected file bytes }
        "206": { description: Protected video byte range }
        "403": { description: Membership required }
        "404": { description: Take not found }
  /membership:
    get:
      operationId: getMembershipStatus
      tags: [membership]
      summary: Get the signed-in account's verified projection access
      responses:
        "200":
          description: Membership status verified against Whop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipStatus" }
  /membership/checkout:
    post:
      operationId: createMembershipCheckout
      tags: [membership]
      summary: Create hosted Whop checkout bound to the authenticated account
      responses:
        "200":
          description: Checkout URL; a redirect does not grant access
          content:
            application/json:
              schema:
                type: object
                required: [purchaseUrl]
                properties:
                  purchaseUrl: { type: string, format: uri }
        "401": { description: Sign in required }
        "403": { description: Invalid request origin }
        "409": { description: Account already has paid access }
        "503": { description: Checkout temporarily unavailable }
  /membership/cancel:
    post:
      operationId: cancelMembership
      tags: [membership]
      summary: Stop renewal for this account's verified membership, keeping paid-through access
      responses:
        "200":
          description: Updated membership status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipStatus" }
        "401": { description: Sign in required }
        "403": { description: Invalid request origin }
        "404": { description: No linked membership }
        "503": { description: Billing temporarily unavailable }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dfs/model-projections:
    get:
      operationId: getModelProjections
      tags: [dfs]
      summary: ALLPLAY historical-performance matchup stat projections
      parameters:
        - name: sport
          in: query
          required: true
          schema: { $ref: "#/components/schemas/DfsSport" }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: recentGames
          in: query
          schema: { type: integer, minimum: 3, maximum: 10, default: 5 }
        - name: recentWeight
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 70 }
        - name: matchupWeight
          in: query
          schema: { type: integer, minimum: 0, maximum: 50, default: 25 }
      responses:
        "200":
          description: Protected model sheet, explicit warming progress or missing coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProjectionSheet" }
        "400":
          description: Invalid model filters
  /dfs/dashboard:
    get:
      operationId: getDfsDashboard
      tags: [dfs]
      summary: Get multi-sport DFS dashboard data
      description: Returns a date's event slate, available betting totals, sourced fantasy projections, and recent sports news.
      parameters:
        - name: date
          in: query
          required: false
          description: Local calendar date in YYYY-MM-DD format; defaults to today.
          schema:
            type: string
            format: date
        - name: sport
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DfsSport"
        - name: salaryPlatform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DfsSalaryPlatform"
        - name: nextSlateIfEmpty
          in: query
          required: false
          description: For a selected sport, advance to its next published game day if the requested day is empty.
          schema:
            type: boolean
            default: false
        - name: slateId
          in: query
          required: false
          description: Salary slate belonging to the selected sport and Eastern calendar date.
          schema:
            type: string
            pattern: '^[0-9]{1,12}$'
      responses:
        "200":
          description: Dashboard data with explicit coverage and source notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DfsDashboard"
        "400":
          description: Invalid date or sport
components:
  schemas:
    FeedbackTicketInput:
      type: object
      required: [category, subject, details]
      properties:
        category: { type: string, enum: [issue, request, general] }
        subject: { type: string, minLength: 3, maxLength: 120 }
        details: { type: string, minLength: 10, maxLength: 4000 }
        sport:
          anyOf:
            - { $ref: "#/components/schemas/DfsSport" }
            - { type: "null" }
        contextPath: { type: ["string", "null"], maxLength: 200, pattern: "^/[a-zA-Z0-9/_-]*$" }
    FeedbackTicketUpdate:
      type: object
      required: [status, ownerResponse]
      properties:
        status: { type: string, enum: [open, in_progress, resolved] }
        ownerResponse: { type: string, maxLength: 2000 }
    FeedbackTicket:
      type: object
      required: [id, category, subject, details, sport, contextPath, status, ownerResponse, createdAt, updatedAt]
      properties:
        id: { type: integer }
        category: { type: string, enum: [issue, request, general] }
        subject: { type: string }
        details: { type: string }
        sport:
          anyOf:
            - { $ref: "#/components/schemas/DfsSport" }
            - { type: "null" }
        contextPath: { type: ["string", "null"] }
        status: { type: string, enum: [open, in_progress, resolved] }
        ownerResponse: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackTicketPage:
      type: object
      required: [isOwner, items, nextCursor]
      properties:
        isOwner: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedbackTicket" }
        nextCursor: { type: ["integer", "null"] }
    ModelProjectionSheet:
      type: object
      required: [status, sport, requestedDate, slateDate, generatedAt, effectiveAsOf, recentGames, recentWeight, matchupWeight, gameCount, processedGames, totalGames, failedGames, observedTeams, players, metrics, modelFormula, notes]
      properties:
        status: { type: string, enum: [locked, warming, ready, unavailable, error] }
        sport: { $ref: "#/components/schemas/DfsSport" }
        requestedDate: { type: string, format: date }
        slateDate: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        effectiveAsOf: { type: ["string", "null"], format: date-time }
        recentGames: { type: integer }
        recentWeight: { type: integer }
        matchupWeight: { type: integer }
        gameCount: { type: integer }
        processedGames: { type: integer }
        totalGames: { type: integer }
        failedGames: { type: integer }
        observedTeams: { type: integer }
        players:
          type: array
          items: { $ref: "#/components/schemas/ModelPlayerProjection" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ModelMetric" }
        modelFormula: { type: string }
        notes:
          type: array
          items: { type: string }
    ModelMetric:
      type: object
      required: [id, label, unit, group, higherIsBetter]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        group: { type: string }
        higherIsBetter: { type: boolean }
    ModelPlayerProjection:
      type: object
      required: [id, name, team, teamId, opponent, opponentId, position, availability, participation, historicalGames, reason, stats, history]
      properties:
        id: { type: string }
        name: { type: string }
        team: { type: string }
        teamId: { type: string }
        opponent: { type: string }
        opponentId: { type: string }
        position: { type: string }
        availability: { type: string }
        participation: { type: string }
        roleContext:
          $ref: "#/components/schemas/ModelPlayerRole"
        historicalGames: { type: integer }
        reason: { type: ["string", "null"] }
        modelTeamTotal: { type: ["number", "null"] }
        modelGameTotal: { type: ["number", "null"] }
        fantasy:
          type: array
          items: { $ref: "#/components/schemas/ModelFantasyForecast" }
        publishedMatchups:
          type: array
          items: { $ref: "#/components/schemas/PublishedMatchupRanking" }
        stats:
          type: array
          items: { $ref: "#/components/schemas/ModelStatEstimate" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ModelHistoryAppearance" }
    PublishedMatchupRanking:
      type: object
      required: [source, unit, rank, rankedTeams, rankOneMeans, sourceUrl, period, asOf, status, note]
      properties:
        source: { type: string, enum: [pff, fantasypros] }
        unit: { type: string }
        rank: { type: ["integer", "null"] }
        rankedTeams: { type: integer }
        rankOneMeans: { type: string, enum: [strongest, most-allowed] }
        sourceUrl: { type: string }
        period: { type: string }
        asOf: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [available, unavailable, unsupported] }
        note: { type: string }
    ModelStatEstimate:
      type: object
      required: [id, projected, recentAverage, baselineAverage, matchupMultiplier, opponentRank, rankedTeams, defenseGames, opponentMean, leagueMean, sampleSize, recentSampleSize]
      properties:
        id: { type: string }
        projected: { type: ["number", "null"] }
        recentAverage: { type: ["number", "null"] }
        baselineAverage: { type: ["number", "null"] }
        matchupMultiplier: { type: number }
        opponentRank: { type: ["integer", "null"] }
        rankedTeams: { type: integer }
        defenseGames: { type: integer }
        opponentMean: { type: ["number", "null"] }
        leagueMean: { type: ["number", "null"] }
        sampleSize: { type: integer }
        recentSampleSize: { type: integer }
    ModelFantasyForecast:
      type: object
      required: [site, status, mean, trackedMean, std, p25, p50, p75, p85, p95, p99, sampleSize, simulations, missingStats, notes, scoringSource, rulesAsOf]
      properties:
        site: { type: string, enum: [draftkings, fanduel, yahoo, ownersbox] }
        status: { type: string, enum: [ready, partial, unavailable] }
        mean: { type: ["number", "null"] }
        trackedMean: { type: ["number", "null"] }
        std: { type: ["number", "null"] }
        p25: { type: ["number", "null"] }
        p50: { type: ["number", "null"] }
        p75: { type: ["number", "null"] }
        p85: { type: ["number", "null"] }
        p95: { type: ["number", "null"] }
        p99: { type: ["number", "null"] }
        sampleSize: { type: integer }
        simulations: { type: integer }
        missingStats:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
        scoringSource: { type: ["string", "null"] }
        rulesAsOf: { type: string }
    ModelPlayerRole:
      type: object
      required: [status, label, depthRank, eligible, source, sourceUrl, asOf, note, recentWorkload, workloadUnit, recentAppearances, teamGames]
      properties:
        status: { type: string, enum: [starter, projected-starter, rotation, backup, unknown, entrant] }
        label: { type: string }
        depthRank: { type: ["integer", "null"] }
        eligible: { type: boolean }
        source: { type: string }
        sourceUrl: { type: ["string", "null"] }
        asOf: { type: ["string", "null"], format: date-time }
        note: { type: string }
        recentWorkload: { type: ["number", "null"] }
        workloadUnit: { type: ["string", "null"] }
        recentAppearances: { type: integer }
        teamGames: { type: integer }
    ModelHistoryAppearance:
      type: object
      required: [eventId, date, opponent, stats]
      properties:
        eventId: { type: string }
        date: { type: string, format: date-time }
        opponent: { type: string }
        stats:
          type: object
          additionalProperties: { type: number }
    PublishTakeInput:
      allOf:
        - { $ref: "#/components/schemas/GameTakeInput" }
        - type: object
          required: [uploadId]
          properties:
            uploadId: { type: string, format: uuid }
    TakeUploadInput:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 200 }
        contentType:
          type: string
          enum: [application/pdf, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document, video/mp4, video/webm]
        size: { type: integer, minimum: 1, maximum: 262144000 }
    GameTakeInput:
      type: object
      required: [title, description, sport, game]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        sport: { $ref: "#/components/schemas/DfsSport" }
        game: { type: string, maxLength: 150 }
    GameTake:
      allOf:
        - { $ref: "#/components/schemas/GameTakeInput" }
        - type: object
          required: [id, fileName, contentType, size, createdAt]
          properties:
            id: { type: string, format: uuid }
            fileName: { type: string }
            contentType: { type: string }
            size: { type: integer }
            createdAt: { type: string, format: date-time }
    MembershipStatus:
      type: object
      required: [signedIn, hasAccess, ready, status, price, currency, interval, cancelAtPeriodEnd, renewsAt, manageUrl, error]
      properties:
        signedIn: { type: boolean }
        isOwner: { type: boolean, description: Server-assigned owner access; never granted by the browser. }
        hasAccess: { type: boolean }
        ready: { type: boolean }
        status: { type: string }
        price: { type: number }
        currency: { type: string }
        interval: { type: string }
        cancelAtPeriodEnd: { type: boolean }
        renewsAt: { type: ["string", "null"] }
        manageUrl: { type: ["string", "null"], format: uri }
        error: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DfsSport:
      type: string
      enum: [nfl, nhl, wnba, nba, mlb, nascar, cfb]
    DfsSalaryPlatform:
      type: string
      enum: [draftkings, fanduel]
    DfsDashboard:
      type: object
      required: [date, updatedAt, events, news, projections, projectionsLocked, sportCoverage, sourceNotes, salaryCoverage]
      properties:
        projectionsLocked: { type: boolean }
        requestedDate: { type: string, format: date }
        autoAdvanced: { type: boolean }
        slateNotice: { type: ["string", "null"] }
        date:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/DfsEvent"
        news:
          type: array
          items:
            $ref: "#/components/schemas/DfsNewsItem"
        projections:
          type: array
          items:
            $ref: "#/components/schemas/DfsPlayerProjection"
        sportCoverage:
          type: array
          items:
            $ref: "#/components/schemas/DfsSportCoverage"
        salaryCoverage:
          $ref: "#/components/schemas/DfsSalaryCoverage"
        sourceNotes:
          type: array
          items:
            type: string
    DfsEvent:
      type: object
      required: [id, sport, league, name, shortName, startTime, status, competitors]
      properties:
        id: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        league: { type: string }
        name: { type: string }
        shortName: { type: string }
        startTime: { type: string, format: date-time }
        status: { type: string }
        venue: { type: ["string", "null"] }
        totalPoints: { type: ["number", "null"] }
        spread: { type: ["number", "null"] }
        oddsSource: { type: ["string", "null"] }
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/DfsCompetitor"
    DfsCompetitor:
      type: object
      required: [id, name, abbreviation, homeAway]
      properties:
        spread: { type: ["number", "null"] }
        moneyline: { type: ["number", "null"] }
        id: { type: string }
        name: { type: string }
        abbreviation: { type: string }
        homeAway: { type: string }
        logo: { type: ["string", "null"], format: uri }
        score: { type: ["string", "null"] }
    DfsNewsItem:
      type: object
      required: [id, sport, title, source]
      properties:
        id: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        title: { type: string }
        description: { type: ["string", "null"] }
        source: { type: string }
        url: { type: ["string", "null"], format: uri }
        publishedAt: { type: ["string", "null"], format: date-time }
        image: { type: ["string", "null"], format: uri }
    DfsPlayerProjection:
      type: object
      required: [id, name, sport, projection, projectionType, source]
      properties:
        id: { type: string }
        name: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        team: { type: ["string", "null"] }
        opponent: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
        projection: { type: ["number", "null"] }
        projectionType: { type: string }
        source: { type: string }
        updatedAt: { type: ["string", "null"], format: date-time }
        salary: { type: ["integer", "null"] }
        salaryPlatform: { $ref: "#/components/schemas/DfsSalaryPlatform" }
        salarySource: { type: ["string", "null"] }
        salaryPlayerId: { type: ["string", "null"] }
        salarySlateId: { type: ["string", "null"] }
        rosterPositions: { type: ["string", "null"] }
        gameInfo: { type: ["string", "null"] }
        teamLogo: { type: ["string", "null"], format: uri }
        homeAway: { type: ["string", "null"] }
    DfsSalarySlate:
      type: object
      required: [id, name, sport, startTime, gameCount, format]
      properties:
        id: { type: string }
        name: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        startTime: { type: string, format: date-time }
        gameCount: { type: ["integer", "null"] }
        format: { type: string }
    DfsSalaryCoverage:
      type: object
      required: [platform, available, status, source, message, slates, selectedSlateId, fetchedAt]
      properties:
        platform: { $ref: "#/components/schemas/DfsSalaryPlatform" }
        available: { type: boolean }
        status:
          type: string
          enum: [available, no_slates, unavailable, error, select_sport]
        source: { type: string }
        message: { type: string }
        slates:
          type: array
          items:
            $ref: "#/components/schemas/DfsSalarySlate"
        selectedSlateId: { type: ["string", "null"] }
        fetchedAt: { type: ["string", "null"], format: date-time }
    DfsSportCoverage:
      type: object
      required: [sport, label, eventsAvailable, projectionsAvailable, newsAvailable, message]
      properties:
        sport: { $ref: "#/components/schemas/DfsSport" }
        label: { type: string }
        eventsAvailable: { type: boolean }
        projectionsAvailable: { type: boolean }
        newsAvailable: { type: boolean }
        message: { type: string }

