openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dfs
    description: Daily fantasy sports dashboard
paths:
  /membership:
    get:
      operationId: getMembershipStatus
      tags: [membership]
      summary: Get the signed-in account's verified projection access
      responses:
        "200":
          description: Membership status verified against Whop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipStatus" }
  /membership/checkout:
    post:
      operationId: createMembershipCheckout
      tags: [membership]
      summary: Create hosted Whop checkout bound to the authenticated account
      responses:
        "200":
          description: Checkout URL; a redirect does not grant access
          content:
            application/json:
              schema:
                type: object
                required: [purchaseUrl]
                properties:
                  purchaseUrl: { type: string, format: uri }
        "401": { description: Sign in required }
        "403": { description: Invalid request origin }
        "409": { description: Account already has paid access }
        "503": { description: Checkout temporarily unavailable }
  /membership/cancel:
    post:
      operationId: cancelMembership
      tags: [membership]
      summary: Stop renewal for this account's verified membership, keeping paid-through access
      responses:
        "200":
          description: Updated membership status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipStatus" }
        "401": { description: Sign in required }
        "403": { description: Invalid request origin }
        "404": { description: No linked membership }
        "503": { description: Billing temporarily unavailable }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dfs/dashboard:
    get:
      operationId: getDfsDashboard
      tags: [dfs]
      summary: Get multi-sport DFS dashboard data
      description: Returns a date's event slate, available betting totals, sourced fantasy projections, and recent sports news.
      parameters:
        - name: date
          in: query
          required: false
          description: Local calendar date in YYYY-MM-DD format; defaults to today.
          schema:
            type: string
            format: date
        - name: sport
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DfsSport"
        - name: salaryPlatform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DfsSalaryPlatform"
        - name: nextSlateIfEmpty
          in: query
          required: false
          description: For a selected sport, advance to its next published game day if the requested day is empty.
          schema:
            type: boolean
            default: false
        - name: slateId
          in: query
          required: false
          description: Salary slate belonging to the selected sport and Eastern calendar date.
          schema:
            type: string
            pattern: '^[0-9]{1,12}$'
      responses:
        "200":
          description: Dashboard data with explicit coverage and source notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DfsDashboard"
        "400":
          description: Invalid date or sport
components:
  schemas:
    MembershipStatus:
      type: object
      required: [signedIn, hasAccess, ready, status, price, currency, interval, cancelAtPeriodEnd, renewsAt, manageUrl, error]
      properties:
        signedIn: { type: boolean }
        hasAccess: { type: boolean }
        ready: { type: boolean }
        status: { type: string }
        price: { type: number }
        currency: { type: string }
        interval: { type: string }
        cancelAtPeriodEnd: { type: boolean }
        renewsAt: { type: ["string", "null"] }
        manageUrl: { type: ["string", "null"], format: uri }
        error: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DfsSport:
      type: string
      enum: [nfl, nhl, wnba, nba, mlb, nascar, cfb]
    DfsSalaryPlatform:
      type: string
      enum: [draftkings, fanduel]
    DfsDashboard:
      type: object
      required: [date, updatedAt, events, news, projections, projectionsLocked, sportCoverage, sourceNotes, salaryCoverage]
      properties:
        projectionsLocked: { type: boolean }
        requestedDate: { type: string, format: date }
        autoAdvanced: { type: boolean }
        slateNotice: { type: ["string", "null"] }
        date:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/DfsEvent"
        news:
          type: array
          items:
            $ref: "#/components/schemas/DfsNewsItem"
        projections:
          type: array
          items:
            $ref: "#/components/schemas/DfsPlayerProjection"
        sportCoverage:
          type: array
          items:
            $ref: "#/components/schemas/DfsSportCoverage"
        salaryCoverage:
          $ref: "#/components/schemas/DfsSalaryCoverage"
        sourceNotes:
          type: array
          items:
            type: string
    DfsEvent:
      type: object
      required: [id, sport, league, name, shortName, startTime, status, competitors]
      properties:
        id: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        league: { type: string }
        name: { type: string }
        shortName: { type: string }
        startTime: { type: string, format: date-time }
        status: { type: string }
        venue: { type: ["string", "null"] }
        totalPoints: { type: ["number", "null"] }
        spread: { type: ["number", "null"] }
        oddsSource: { type: ["string", "null"] }
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/DfsCompetitor"
    DfsCompetitor:
      type: object
      required: [id, name, abbreviation, homeAway]
      properties:
        spread: { type: ["number", "null"] }
        moneyline: { type: ["number", "null"] }
        id: { type: string }
        name: { type: string }
        abbreviation: { type: string }
        homeAway: { type: string }
        logo: { type: ["string", "null"], format: uri }
        score: { type: ["string", "null"] }
    DfsNewsItem:
      type: object
      required: [id, sport, title, source]
      properties:
        id: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        title: { type: string }
        description: { type: ["string", "null"] }
        source: { type: string }
        url: { type: ["string", "null"], format: uri }
        publishedAt: { type: ["string", "null"], format: date-time }
        image: { type: ["string", "null"], format: uri }
    DfsPlayerProjection:
      type: object
      required: [id, name, sport, projection, projectionType, source]
      properties:
        id: { type: string }
        name: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        team: { type: ["string", "null"] }
        opponent: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
        projection: { type: ["number", "null"] }
        projectionType: { type: string }
        source: { type: string }
        updatedAt: { type: ["string", "null"], format: date-time }
        salary: { type: ["integer", "null"] }
        salaryPlatform: { $ref: "#/components/schemas/DfsSalaryPlatform" }
        salarySource: { type: ["string", "null"] }
        salaryPlayerId: { type: ["string", "null"] }
        salarySlateId: { type: ["string", "null"] }
        rosterPositions: { type: ["string", "null"] }
        gameInfo: { type: ["string", "null"] }
        teamLogo: { type: ["string", "null"], format: uri }
        homeAway: { type: ["string", "null"] }
    DfsSalarySlate:
      type: object
      required: [id, name, sport, startTime, gameCount, format]
      properties:
        id: { type: string }
        name: { type: string }
        sport: { $ref: "#/components/schemas/DfsSport" }
        startTime: { type: string, format: date-time }
        gameCount: { type: ["integer", "null"] }
        format: { type: string }
    DfsSalaryCoverage:
      type: object
      required: [platform, available, status, source, message, slates, selectedSlateId, fetchedAt]
      properties:
        platform: { $ref: "#/components/schemas/DfsSalaryPlatform" }
        available: { type: boolean }
        status:
          type: string
          enum: [available, no_slates, unavailable, error, select_sport]
        source: { type: string }
        message: { type: string }
        slates:
          type: array
          items:
            $ref: "#/components/schemas/DfsSalarySlate"
        selectedSlateId: { type: ["string", "null"] }
        fetchedAt: { type: ["string", "null"], format: date-time }
    DfsSportCoverage:
      type: object
      required: [sport, label, eventsAvailable, projectionsAvailable, newsAvailable, message]
      properties:
        sport: { $ref: "#/components/schemas/DfsSport" }
        label: { type: string }
        eventsAvailable: { type: boolean }
        projectionsAvailable: { type: boolean }
        newsAvailable: { type: boolean }
        message: { type: string }

